apply plugin: 'com.android.application'

android {
    namespace 'com.doguboxd.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.doguboxd.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
